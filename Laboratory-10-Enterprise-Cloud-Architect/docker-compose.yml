services:
  db:
    image: mysql:8.0
    container_name: enterprise_mysqql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: SecureRootPassword2026!
      MYSQL_DATABASE: enterprise_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: SecureAppPassword2026!
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - enterprise_net

  wordpress:
    image: wordpress:latest
    container_name: enterprise_wordpress_app
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: enterprise_db
      WORDPRESS_DB_USER: app_user
      WORDPRESS_DB_PASSWORD: SecureAppPassword2026!
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - enterprise_net
    depends_on:
      - db

volumes:
  db_data: {}
  wordpress_data:
    driver: local

networks:
  enterprise_net:
    driver: bridge
